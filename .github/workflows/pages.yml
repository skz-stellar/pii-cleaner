name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'apps/web/**'
      - 'samples/**'
      - 'scripts/build-web.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test sanitizer, web privacy guarantees, and CLI
        run: node --test "core/test/*.test.js" apps/web/test/nonetwork.test.js "apps/cli/test/*.test.js"
      - run: bash scripts/build-web.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
